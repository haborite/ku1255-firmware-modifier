[package]
name = "ku1255-firmware-modifier"
version = "0.10.0"
authors = ["haborite <korintje@ymail.ne.jp>"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/ku1255-core"]

[dependencies]
ku1255-core = { path = "crates/ku1255-core" }
csv = "1.3"
dirs = "6"
include_dir = "0.7"
futures-channel = "0.3"
futures-util = "0.3"
hidapi = { version = "2.6", features = ["macos-shared-device"] }
dioxus = { version = "0.7.10", features = [] }
# dioxus-charts = "0.4"
regex = "1.11.1"
rfd = "0.15.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[features]
default = ["desktop"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
# web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
# mobile = ["dioxus/mobile"]

[profile.release]
# dx bundles with a profile inheriting this one and strips only when it is set here.
strip = true
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
